# NICOLA J型の配列定義（標準配列。説明と出典は docs/design.md、書式は docs/implementation.md）
#
# 事実（どのキーのどの面に何の文字があるか）を本プロジェクト独自の形式で記述したもの。
# 配列を変更するときは、このファイルを編集せず、配列差分ファイルを使用する（docs/layout-overlays.md）。

[meta]
name = "NICOLA J型"
variant = "J"
source = "NICOLA配列規格書 2000-01-08 + 2018-11正誤、数字段は JIS 提案の J型図＋〜『』の追加"

